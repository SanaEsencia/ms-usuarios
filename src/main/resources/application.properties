spring.application.name=ms-usuarios
# Puerto del microservicio de usuarios (la app usa http://10.0.2.2:8081/)
server.port=8081

# Conexión a MySQL de XAMPP. La base se crea sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/sanaesencia_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que se ejecuta (útil para explicar en la defensa)
spring.jpa.show-sql=true